  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نشاط: أصلح الدمية</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#b48bd6;
    --purple-dark:#8a5fb3;
    --pink:#ffb3d1;
    --yellow:#ffe08a;
    --green:#7fd8a6;
    --bg1:#fdf3ff;
    --bg2:#eaf6ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:'Baloo Bhaijan 2','Tahoma',sans-serif;}
  body{
    background:radial-gradient(circle at 20% 10%, var(--bg2), var(--bg1) 60%);
    display:flex;align-items:center;justify-content:center;
  }
  #app{
    width:100%;
    max-width:520px;
    height:100vh;
    max-height:920px;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px 4px 14px;
    flex:0 0 auto;
  }
  .timer-wrap{
    display:flex;align-items:center;gap:6px;
    background:#fff;border-radius:30px;padding:6px 12px;
    box-shadow:0 4px 10px rgba(150,100,200,0.18);
    font-weight:800;color:var(--purple-dark);font-size:15px;
  }
  .timer-dot{width:10px;height:10px;border-radius:50%;background:var(--green);}
  .timer-dot.low{background:#ff8c8c;}
  .restart-btn{
    background:#fff;border:none;border-radius:30px;padding:8px 14px;
    font-weight:800;color:var(--purple-dark);font-size:14px;
    box-shadow:0 4px 10px rgba(150,100,200,0.18);
    display:flex;align-items:center;gap:6px;cursor:pointer;
  }
  .progress-wrap{
    display:flex;gap:6px;justify-content:center;padding:2px 14px 8px;
    flex:0 0 auto;
  }
  .progress-dot{
    width:100%;height:8px;border-radius:5px;background:#e6d6f5;overflow:hidden;
  }
  .progress-dot .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--purple),var(--pink));transition:width .4s;}

  .speech-bubble{
    margin:4px 16px 10px 16px;
    background:#fff;
    border-radius:20px;
    padding:12px 16px;
    text-align:center;
    font-size:16px;
    font-weight:700;
    color:#6b4894;
    box-shadow:0 4px 14px rgba(150,100,200,0.15);
    flex:0 0 auto;
    min-height:26px;
    position:relative;
  }
  .stage{
    position:relative;
    flex:1 1 auto;
    margin:0 12px 12px 12px;
    border-radius:26px;
    background:#ffffffaa;
    box-shadow:inset 0 0 0 2px #ffffff90, 0 6px 20px rgba(150,100,200,0.12);
    overflow:hidden;
  }
  .scene{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
  }
  .scene.active{display:flex;}
  .imgbox{
    position:relative;
    margin-top:6%;
  }
  .imgbox img.base{
    display:block;
    max-width:100%;
    pointer-events:none;
    filter:drop-shadow(0 10px 14px rgba(120,80,160,0.22));
  }
  .target{
    position:absolute;
    border-radius:50%;
    border:3px dashed #b48bd6aa;
    background:rgba(180,139,214,0.10);
    transform:translate(-50%,-50%);
    animation:pulse 1.6s ease-in-out infinite;
  }
  .target.done{
    border-color:transparent;
    background:transparent;
    animation:none;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(180,139,214,0.35);}
    50%{box-shadow:0 0 0 10px rgba(180,139,214,0);}
  }
  .piece{
    position:absolute;
    cursor:grab;
    touch-action:none;
    filter:drop-shadow(0 8px 10px rgba(120,80,160,0.3));
    transition:box-shadow .2s;
    z-index:5;
  }
  .piece .rotor{ transform-origin:50% 50%; }
  .piece img{display:block;pointer-events:none;-webkit-user-drag:none;}
  .piece.dragging{cursor:grabbing;z-index:20;filter:drop-shadow(0 14px 18px rgba(120,80,160,0.4));}
  .piece.placed{cursor:default;animation:none;}
  .piece.wiggle{animation:wiggle 0.9s ease-in-out infinite;}
  @keyframes wiggle{
    0%,100%{transform:rotate(-4deg);}
    50%{transform:rotate(4deg);}
  }
  .piece-tray{
    position:absolute;bottom:4%;left:0;right:0;
    display:flex;justify-content:center;gap:10%;
    pointer-events:none;
  }

  .feedback{
    position:absolute;
    top:38%;left:50%;
    transform:translate(-50%,-50%) scale(0.6);
    background:#fff;
    border-radius:26px;
    padding:18px 26px;
    box-shadow:0 10px 30px rgba(120,80,160,0.35);
    text-align:center;
    opacity:0;
    pointer-events:none;
    z-index:50;
    transition:opacity .25s, transform .25s;
  }
  .feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .feedback .emoji{font-size:44px;display:block;margin-bottom:4px;}
  .feedback .txt{font-size:22px;font-weight:800;color:var(--purple-dark);}
  .feedback.bad .txt{color:#d9647a;}

  .bottombar{
    flex:0 0 auto;
    padding:10px 16px 18px;
    display:flex;justify-content:center;
  }
  .btn{
    border:none;border-radius:30px;
    padding:14px 34px;
    font-size:17px;font-weight:800;
    color:#fff;
    background:linear-gradient(135deg,var(--purple),#c98ee0);
    box-shadow:0 8px 18px rgba(150,100,200,0.4);
    cursor:pointer;
    display:flex;align-items:center;gap:8px;
  }
  .btn:disabled{opacity:.4;filter:grayscale(.4);cursor:default;}
  .btn.secondary{
    background:linear-gradient(135deg,#ffd27f,#ffb37f);
  }

  /* start / end screens */
  .cover{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:18px;
    background:linear-gradient(160deg,#fff 0%, #f6e9ff 100%);
    z-index:100;
    padding:30px;
  }
  .cover.hidden{display:none;}
  .cover h1{
    font-size:26px;color:var(--purple-dark);margin:0;
  }
  .cover p{
    font-size:16px;color:#7a5fa0;margin:0;max-width:320px;
  }
  .cover .icons{font-size:54px;}
  .confetti{
    position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden;
  }
  .confetti span{
    position:absolute;top:-10%;
    font-size:22px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(115vh) rotate(360deg); opacity:0.9;}
  }
</style>
</head>
<body>

    <div class="timer-wrap"><span class="timer-dot" id="timerDot"></span><span id="timerText">٢٠</span></div>

  </div>

  <div class="progress-wrap" id="progressWrap"></div>

  <div class="speech-bubble" id="speechBubble">مرحباً! هيا نصلح الدمية 🧸</div>

      {pieceId:'piece-leg', targetId:'target-leg', tx:0.372, ty:0.734, tol:0.075, startX:0.78, startY:0.64, jitterX:0.14, jitterY:0.08, targetSize:0.13}
    ]
  },
  {
    id:'wheel1',
    sceneEl:'scene-wheel1',
    intro:'يلا نصلح السيارة! هذه السيارة ناقصة عجلة واحدة، اسحب العجلة وضعها في مكانها.',
    success:'ممتاز! صارت السيارة جاهزة',
    pieces:[
      {pieceId:'piece-wheel1', targetId:'target-wheel1', tx:0.762, ty:0.698, tol:0.10, startX:0.22, startY:0.85, jitterX:0.10, jitterY:0.05, targetSize:0.24}
    ]
  },
  {
    id:'wheel2',
    sceneEl:'scene-wheel2',
    intro:'هذه السيارة ناقصة عجلتين! اسحب كل عجلة وضعها في مكانها.',
    success:'ممتاز! أصلحنا كل العجلات',
    pieces:[
      {pieceId:'piece-wheelA', targetId:'target-wheelA', tx:0.259, ty:0.688, tol:0.10, startX:0.20, startY:0.85, jitterX:0.08, jitterY:0.05, targetSize:0.20},
      {pieceId:'piece-wheelB', targetId:'target-wheelB', tx:0.451, ty:0.705, tol:0.10, startX:0.78, startY:0.85, jitterX:0.08, jitterY:0.05, targetSize:0.20}
    ]
  }
];

function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function randomizeStart(p){
  const jx = p.jitterX||0, jy = p.jitterY||0;
  p._startX = clamp(p.startX + (Math.random()-0.5)*2*jx, 0.14, 0.86);
  p._startY = clamp(p.startY + (Math.random()-0.5)*2*jy, 0.10, 0.92);
}

/* ------------- State ------------- */
let sceneIndex = 0;
let timerInterval = null;
let timeLeft = 20;
const TOTAL_TIME = 20;

const app = document.getElementById('app');
const stage = document.getElementById('stage');
const speechBubble = document.getElementById('speechBubble');
const feedback = document.getElementById('feedback');
const feedbackEmoji = document.getElementById('feedbackEmoji');
const feedbackTxt = document.getElementById('feedbackTxt');
const nextBtn = document.getElementById('nextBtn');
const timerText = document.getElementById('timerText');
const timerDot = document.getElementById('timerDot');
const progressWrap = document.getElementById('progressWrap');
const coverStart = document.getElementById('coverStart');
const coverEnd = document.getElementById('coverEnd');

/* progress dots */
SCENES.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className='progress-dot';
  d.innerHTML = '<div class="fill" id="fill-'+i+'"></div>';
  progressWrap.appendChild(d);
});

function arabicDigits(n){
  const map = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  return String(n).split('').map(ch=> /[0-9]/.test(ch)? map[+ch]: ch).join('');
}

/* ------------- Speech ------------- */
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const arVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('ar'));
    if(arVoice) u.voice = arVoice;
    u.lang = 'ar-SA';
    u.rate = 0.95;
    u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function say(text){
  speechBubble.textContent = text;
  speak(text);
}

/* ------------- Timer ------------- */
function startTimer(){
  clearInterval(timerInterval);
  timeLeft = TOTAL_TIME;
  timerText.textContent = arabicDigits(timeLeft);
  timerDot.classList.remove('low');
  timerInterval = setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){
      timeLeft=0;
      clearInterval(timerInterval);
      timerText.textContent = arabicDigits(0);
      timerDot.classList.add('low');
      onTimeUp();
      return;
    }
    timerText.textContent = arabicDigits(timeLeft);
    if(timeLeft<=7) timerDot.classList.add('low'); else timerDot.classList.remove('low');
  },1000);
}
function stopTimer(){ clearInterval(timerInterval); }

function onTimeUp(){
  feedbackEmoji.textContent = '⏰';
  feedbackTxt.textContent = 'انتهى الوقت';
  feedback.classList.remove('bad');
  feedback.classList.add('show');
  say('انتهى الوقت! هيا نبدأ من جديد');
  setTimeout(()=>{
    feedback.classList.remove('show');
    resetGame();
  }, 1600);
}

/* ------------- Confetti ------------- */
function burstConfetti(){
  const box = document.getElementById('confetti');
  const emojis = ['🌸','⭐','🎉','💜','✨'];
  for(let i=0;i<18;i++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = (Math.random()*100)+'%';
    s.style.animationDuration = (1.6+Math.random()*1.2)+'s';
    s.style.fontSize = (16+Math.random()*14)+'px';
    box.appendChild(s);
    setTimeout(()=>s.remove(), 3000);
  }
}

/* ------------- Feedback ------------- */
function showFeedback(good){
  feedback.classList.toggle('bad', !good);
  feedbackEmoji.textContent = good ? '🌟' : '🙈';
  feedbackTxt.textContent = good ? 'ممتاز' : 'حاول مرة أخرى';
  feedback.classList.add('show');
  if(good) burstConfetti();
  setTimeout(()=>{ feedback.classList.remove('show'); }, 1000);
}

/* ------------- Drag logic ------------- */
function setupPiece(pieceCfg, scene){
  const pieceEl = document.getElementById(pieceCfg.pieceId);
  const targetEl = document.getElementById(pieceCfg.targetId);
  const imgbox = pieceEl.parentElement.querySelector('.imgbox');

  // position target as % of imgbox (left/top), but size in px for a true circle
  targetEl.style.left = (pieceCfg.tx*100)+'%';
  targetEl.style.top = (pieceCfg.ty*100)+'%';
  function sizeTarget(){
    const w = imgbox.getBoundingClientRect().width;
    const px = w * pieceCfg.targetSize;
    targetEl.style.width = px+'px';
    targetEl.style.height = px+'px';
  }
  sizeTarget();
  window.addEventListener('resize', sizeTarget);

  // initial piece position (relative to scene, not imgbox), using percentage of scene
  randomizeStart(pieceCfg);
  pieceEl.style.left = (pieceCfg._startX*100)+'%';
  pieceEl.style.top = (pieceCfg._startY*100)+'%';
  pieceEl.style.transform = 'translate(-50%,-50%)';
  pieceEl.classList.add('wiggle');
  pieceEl.classList.remove('placed');

  let dragging=false, offsetX=0, offsetY=0, placed=false;
  let sceneEl = document.getElementById(scene.sceneEl);

  function pointerDown(e){
    if(placed) return;
    dragging = true;
    pieceEl.classList.add('dragging');
    pieceEl.classList.remove('wiggle');
    pieceEl.setPointerCapture(e.pointerId);
    const rect = pieceEl.getBoundingClientRect();
    offsetX = (e.clientX - rect.left) - rect.width/2;
    offsetY = (e.clientY - rect.top) - rect.height/2;
  }
  function pointerMove(e){
    if(!dragging) return;
    const sceneRect = sceneEl.getBoundingClientRect();
    let x = e.clientX - sceneRect.left - offsetX;
    let y = e.clientY - sceneRect.top - offsetY;
    pieceEl.style.left = x+'px';
    pieceEl.style.top = y+'px';
  }
  function pointerUp(e){
    if(!dragging) return;
    dragging=false;
    pieceEl.classList.remove('dragging');

    // compute piece center relative to imgbox in percentage
    const pieceRect = pieceEl.getBoundingClientRect();
    const boxRect = imgbox.getBoundingClientRect();
    const cx = (pieceRect.left + pieceRect.width/2 - boxRect.left)/boxRect.width;
    const cy = (pieceRect.top + pieceRect.height/2 - boxRect.top)/boxRect.height;

    const dx = cx - pieceCfg.tx;
    const dy = cy - pieceCfg.ty;
    const dist = Math.sqrt(dx*dx+dy*dy);

    if(dist <= pieceCfg.tol){
      // snap into place, position relative to scene
      const sceneRect = sceneEl.getBoundingClientRect();
      const targetCenterX = boxRect.left - sceneRect.left + pieceCfg.tx*boxRect.width;
      const targetCenterY = boxRect.top - sceneRect.top + pieceCfg.ty*boxRect.height;
      pieceEl.style.left = targetCenterX+'px';
      pieceEl.style.top = targetCenterY+'px';
      pieceEl.classList.add('placed');
      targetEl.classList.add('done');
      placed = true;
      onPiecePlaced(scene);
      showFeedback(true);
    } else {
      // bounce back
      pieceEl.style.left = (pieceCfg._startX*100)+'%';
      pieceEl.style.top = (pieceCfg._startY*100)+'%';
      pieceEl.classList.add('wiggle');
      showFeedback(false);
      say('حاول مرة أخرى');
    }
  }

  pieceEl.addEventListener('pointerdown', pointerDown);
  window.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);

  pieceCfg._isPlaced = ()=>placed;
}

function onPiecePlaced(scene){
  const allPlaced = scene.pieces.every(p=>p._isPlaced());
  if(allPlaced){
    stopTimer();
    document.getElementById('fill-'+sceneIndex).style.width='100%';
    setTimeout(()=>{ say(scene.success); }, 250);
    setTimeout(()=>{
      if(sceneIndex === SCENES.length-1){
        endGame();
      } else if(sceneIndex === 1){
        // after finishing bear part, show "next: fix the car" button
        nextBtn.style.display='inline-flex';
        nextBtn.textContent = 'التالي: يلا نصلح السيارة ←';
      } else {
        goToScene(sceneIndex+1);
      }
    }, 1300);
  }
}

/* ------------- Scene control ------------- */
function goToScene(idx){
  document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));
  sceneIndex = idx;
  const scene = SCENES[idx];
  document.getElementById(scene.sceneEl).classList.add('active');
  nextBtn.style.display='none';
  say(scene.intro);
  startTimer();
  scene.pieces.forEach(p=>{ p._isPlaced = ()=>false; setupPiece(p, scene); });
}

function endGame(){
  coverEnd.classList.remove('hidden');
  say('أحسنت! أنجزت النشاط بنجاح، أنت بطل!');
  burstConfetti();
}

/* ------------- Buttons ------------- */
document.getElementById('startBtn').addEventListener('click', ()=>{
  coverStart.classList.add('hidden');
  goToScene(0);
});
document.getElementById('playAgainBtn').addEventListener('click', resetGame);
document.getElementById('restartBtn').addEventListener('click', resetGame);
nextBtn.addEventListener('click', ()=>{ goToScene(2); });

function resetGame(){
  stopTimer();
  coverEnd.classList.add('hidden');
  coverStart.classList.remove('hidden');
  document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.progress-dot .fill').forEach(f=>f.style.width='0%');
  nextBtn.style.display='none';
  speechBubble.textContent = 'مرحباً! هيا نصلح الدمية 🧸';
  timerText.textContent = arabicDigits(TOTAL_TIME);
  timerDot.classList.remove('low');
}
</script>
